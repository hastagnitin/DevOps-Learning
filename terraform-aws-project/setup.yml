---
- name: Setup General Infrastructure
  hosts: monitoring_server
  become: yes
  tasks:
    - name: Install Apache Web Server
      yum:
        name: httpd
        state: present

    - name: Start and Enable Apache Service
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Deploy Success Landing Page
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Server Status</title>
            <style>
              body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #eef2f3;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
              }
              .card {
                background: white;
                padding: 50px;
                border-radius: 12px;
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
                text-align: center;
                max-width: 600px;
              }
              h1 { 
                color: #2c3e50; 
                margin-bottom: 20px; 
              }
              .status {
                display: inline-block;
                padding: 12px 24px;
                background-color: #27ae60;
                color: white;
                border-radius: 30px;
                font-size: 16px;
                font-weight: bold;
                letter-spacing: 0.5px;
                box-shadow: 0 4px 6px rgba(39, 174, 96, 0.3);
              }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Infrastructure Ready! 🚀</h1>
              <div class="status">Successfully Server provisioned by Terraform and configured by Ansible.</div>
            </div>
          </body>
          </html>
        dest: /var/www/html/index.html
