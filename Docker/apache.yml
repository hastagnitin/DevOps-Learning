---
- hosts: all
  vars:
    package_name: httpd
  become: yes
  tasks:
    - name: Install Apache
      package:
        name: "{{ package_name }}"
        state: present

    - name: COPY webpages
      copy:
        src: index.html
        dest: /var/www/html/

    - name: Start and Enable httpd service
      service:
        name: "{{ package_name }}"    
        state: started
        enabled: yes

    - name: Stop Firewall
      service:
        name: firewalld
        state: stopped
