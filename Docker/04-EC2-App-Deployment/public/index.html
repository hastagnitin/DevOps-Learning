<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Swag E-Commerce Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    
    <nav class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            ☁️ CLOUD_SWAG.IO
        </h1>
        <div class="flex items-center gap-4">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs px-3 py-1.5 rounded-md border border-indigo-500/20 font-mono">
                ENV: AWS_EC2_PRODUCTION
            </span>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="lg:col-span-3">
            <h2 class="text-xl font-bold text-slate-300 mb-6">📦 Available Production Swag</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="products-grid">
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit sticky top-24 shadow-2xl">
            <h2 class="text-xl font-bold text-slate-200 mb-4 flex items-center justify-between">
                <span>🛒 Your Cart</span>
                <span id="cart-count" class="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">0</span>
            </h2>
            
            <div id="cart-items" class="custom-scrollbar space-y-4 max-h-96 overflow-y-auto mb-6 divide-y divide-slate-800/50">
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <div class="flex justify-between font-bold text-lg">
                    <span class="text-slate-400">Total Bill:</span>
                    <span class="text-emerald-400" id="cart-total">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold py-3 rounded-xl shadow-lg transition tracking-wide uppercase text-sm">
                    Place Secure Order
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
