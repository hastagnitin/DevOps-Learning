apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: myapp
        image: jibbran/blue-deploy
        ports:
        - containerPort: 80
