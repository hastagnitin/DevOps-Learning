<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-indigo-200 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold mb-2 text-gray-800 text-center">Student Registration</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Triggers AWS Lambda & Sends SNS Notification</p>
        
        <form id="registrationForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700">Full Name</label>
                <input type="text" id="name" placeholder="Nitin Gupta" required 
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700">Email Address</label>
                <input type="email" id="email" placeholder="nitin@example.com" required 
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700">Course Name</label>
                <input type="text" id="course" placeholder="DevOps 45-Days BootCamp" required 
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-md hover:bg-indigo-700 transition duration-200 shadow-md">
                Register Student
            </button>
        </form>
        
       
        <div id="responseMessage" class="mt-4 p-3 rounded-md text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const course = document.getElementById('course').value;
            const messageDiv = document.getElementById('responseMessage');
            const submitBtn = document.getElementById('submitBtn');

           
            messageDiv.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            messageDiv.classList.add('bg-blue-100', 'text-blue-700');
            messageDiv.innerText = 'Processing with AWS Lambda...';
            submitBtn.disabled = true;

           
            const API_URL = 'https://7vw7vo99u8.execute-api.ap-south-1.amazonaws.com/production/register';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, course })
                });

                const data = await response.json();
                messageDiv.classList.remove('bg-blue-100', 'text-blue-700');

                if (response.ok) {
                    messageDiv.innerText = 'Success! Registration done & Email sent via SNS.';
                    messageDiv.classList.add('bg-green-100', 'text-green-700');
                    document.getElementById('registrationForm').reset();
                } else {
                    messageDiv.innerText = 'Error: ' + (data.message || 'Verification Failed');
                    messageDiv.classList.add('bg-red-100', 'text-red-700');
                }
            } catch (error) {
                messageDiv.classList.remove('bg-blue-100', 'text-blue-700');
                messageDiv.innerText = 'CORS Error or Network Issue! Check browser console.';
                messageDiv.classList.add('bg-red-100', 'text-red-700');
                console.error('Error details:', error);
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
